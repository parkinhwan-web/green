# 애플리케이션 이름 설정
spring.application.name=demo

# 서버 포트 설정 (환경 변수 사용)
server.port=${PORT}

# ✅ PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ✅ HikariCP 설정 (연결 풀 최적화)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000

# ✅ JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 불필요한 DB 세션 유지 방지 (Lazy Loading 관련 이슈 해결)
spring.jpa.open-in-view=false 

# ✅ JWT Secret Key 설정 (환경 변수 사용)
jwt.secret=${JWT_SECRET}

# ✅ Spring Boot Actuator 설정 (외부 접근 가능하도록 수정)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# ✅ Actuator에서 헬스체크를 위한 프로브 활성화
management.endpoint.health.probes.enabled=true  

# ✅ Spring Security 없이 Actuator에 접근 가능하도록 설정
# Spring Boot 3.x 이상에서는 아래 설정이 제거되었으며, Security 설정으로 적용해야 함.
# 필요할 경우, SecurityConfig.java에서 추가적으로 설정

# ✅ 로그 레벨 설정 (오류 수정됨)
logging.level.org.springframework.web=DEBUG

# ✅ 기본 문자 인코딩을 UTF-8로 설정 (Deprecated된 설정 제거)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
