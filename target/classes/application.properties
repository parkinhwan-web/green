# 애플리케이션 이름 설정
spring.application.name=demo

# 서버 포트 설정 (Render는 PORT를 환경 변수로 제공)
server.port=${PORT:8080}

# # ✅ PostgreSQL Database Configuration
# spring.datasource.url=${SPRING_DATASOURCE_URL}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver

# ✅ MySQL DB 설정
spring.datasource.url=jdbc:mysql://localhost:3306/recycle_helper?serverTimezone=Asia/Seoul
spring.datasource.username=recycle_user
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.show-sql=true
# spring.jpa.open-in-view=false

# ✅ HikariCP 설정 (연결 풀 최적화)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000

# # ✅ JPA 설정 (환경 변수로 교체하면 더 유연함)
# spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
# spring.jpa.show-sql=true
# spring.jpa.open-in-view=false

# ✅ JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ✅ JWT Secret Key 설정 (환경 변수 사용, 기본값은 로컬 테스트용)
jwt.secret=${JWT_SECRET:defaultJwtSecretForLocalTesting_ChangeMe!}

# ✅ Actuator 설정 (헬스체크용)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true

# ✅ 로깅
logging.level.org.springframework.web=DEBUG

# ✅ 문자 인코딩 설정
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
