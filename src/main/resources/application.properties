spring.application.name=demo

# 서버 포트 설정 (Render는 PORT를 환경 변수로 제공)
server.port=${PORT:8080}

# ✅ MySQL DB 설정 (Railway)
spring.datasource.url=jdbc:mysql://switchyard.proxy.rlwy.net:29219/railway?serverTimezone=Asia/Seoul
